<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <title>Pixel Cat — Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div><p class="eyebrow">PIXEL-GAME · LEVEL 01</p><h1>PIXEL CAT <span>/ DASH</span></h1></div>
      <div class="score-panel"><span class="score-label">DISTANCE</span><strong id="score">0</strong></div>
    </header>
    <section class="game-area" aria-label="Игровое поле">
      <div class="canvas-frame">
        <canvas id="game" width="320" height="180" aria-label="Игровое поле"></canvas>
        <div class="jump-metrics is-hidden" id="jump-metrics">ВЫСОТА — px · ДЛИНА — px</div>
        <div class="overlay" id="overlay">
          <p class="overlay-kicker">AUTO RUNNER</p><h2 id="overlay-title">PIXEL DASH</h2>
          <p id="overlay-hint">ВЫБЕРИ РЕЖИМ ИГРЫ</p>
          <div class="mode-choices" id="mode-choices"><button class="mode-button game-mode" id="play-mode" type="button"><span class="mode-icon">▶</span><span><strong>НАЧАТЬ</strong><small>Обычный забег</small></span></button><button class="mode-button training-mode" id="training-mode" type="button"><span class="mode-icon">✦</span><span><strong>ТРЕНИРОВКА</strong><small>Практика прыжков</small></span></button></div>
          <button class="character-toggle" id="character-toggle" type="button"><span>♟</span> ВЫБРАТЬ ПЕРСОНАЖА <span class="toggle-arrow">⌄</span></button>
          <div class="character-choices is-hidden" id="character-choices" aria-label="Выбор персонажа">
            <button type="button" data-character="classic" class="character-option is-selected"><span class="character-swatch classic-swatch"></span><span>КЛАССИК</span></button>
            <button type="button" data-character="mint" class="character-option"><span class="character-swatch mint-swatch"></span><span>МЯТА</span></button>
            <button type="button" data-character="violet" class="character-option"><span class="character-swatch violet-swatch"></span><span>СУМРАК</span></button>
          </div>
          <span class="start-cue">PIXEL CAT DASH</span>
        </div>
      </div>
    </section>
    <nav class="controls" aria-label="Игровое управление">
      <button class="control-btn dash-control" id="dash-btn" type="button" aria-label="Дэш"><span>»</span><b>DASH</b></button>
      <button class="control-btn jump-control" id="jump-btn" type="button" aria-label="Прыжок"><span>↑</span><b>JUMP</b></button>
    </nav>
    <footer class="game-footer"><span>ПРЫГАЙ ЧЕРЕЗ ПРОПАСТИ</span><span>ДЭШ — РЫВОК ВПЕРЁД</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
