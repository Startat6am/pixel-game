<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <title>Pixel Cat — Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div><p class="eyebrow">PIXEL-GAME · LEVEL 01</p><h1>PIXEL CAT <span>/ DASH</span></h1></div>
      <div class="score-panel"><span class="score-label">DISTANCE</span><strong id="score">0</strong></div>
    </header>
    <section class="game-area" aria-label="Игровое поле">
      <div class="canvas-frame">
        <canvas id="game" width="320" height="180" aria-label="Игровое поле"></canvas>
        <div class="jump-metrics is-hidden" id="jump-metrics">ВЫСОТА — px · ДЛИНА — px</div>
        <div class="overlay" id="overlay">
          <section class="menu-screen" id="menu-screen">
            <p class="overlay-kicker">PIXEL WORLD · AUTO RUNNER</p>
            <h2 id="overlay-title">PIXEL DASH</h2>
            <p id="overlay-hint">ВЫБЕРИ РЕЖИМ ИГРЫ</p>
            <div class="mode-choices" id="mode-choices">
              <button class="mode-button game-mode" id="play-mode" type="button"><span class="mode-icon">▶</span><span><strong>НАЧАТЬ</strong><small>Новый забег</small></span></button>
              <button class="mode-button training-mode" id="training-mode" type="button"><span class="mode-icon">✦</span><span><strong>ТРЕНИРОВКА</strong><small>Практика прыжков</small></span></button>
            </div>
            <button class="character-toggle" id="character-toggle" type="button"><span>♟</span> ВЫБРАТЬ КОТА <span class="toggle-arrow">→</span></button>
            <span class="start-cue">RUN · JUMP · DASH</span>
          </section>
          <section class="character-screen is-hidden" id="character-screen" aria-label="Выбор персонажа">
            <p class="overlay-kicker">ТВОЯ КОМАНДА</p>
            <h2>ВЫБЕРИ КОТА</h2>
            
            <div class="character-choices" id="character-choices">
              <button type="button" data-character="classic" class="character-option is-selected" aria-label="Выбрать Классика">
                <svg class="character-preview preview-classic" viewBox="0 0 64 56" aria-hidden="true"><path fill="#f3c66a" d="M8 20 8 4 22 14 42 14 56 4 56 20 60 26 60 43 52 51 12 51 4 43 4 26Z"/><path fill="#ffe0a0" d="M18 36h28v11H18z"/><path fill="#26334c" d="M19 27h6v6h-6zm20 0h6v6h-6z"/><path fill="#d97872" d="M29 38h6v4h-6z"/></svg>
                <span class="character-name">КЛАССИК</span></button>
              <button type="button" data-character="mint" class="character-option" aria-label="Выбрать Мяту">
                <svg class="character-preview preview-mint" viewBox="0 0 64 56" aria-hidden="true"><path fill="#7ce0c3" d="M9 23 7 7 23 15 40 15 57 6 55 23 60 30 56 44 48 51 16 51 8 44 4 30Z"/><path fill="#c4ffeb" d="M16 36h32v11H16z"/><path fill="#203d4b" d="M18 27h7v6h-7zm21 0h7v6h-7z"/><path fill="#ef8eaa" d="M29 38h6v4h-6z"/><path fill="#e5fff6" d="M26 12h11v4H26z"/><path fill="#7ce0c3" d="M5 32h5v7H5zm49 0h5v7h-5z"/></svg>
                <span class="character-name">МЯТА</span></button>
              <button type="button" data-character="violet" class="character-option" aria-label="Выбрать Сумрака">
                <svg class="character-preview preview-violet" viewBox="0 0 64 56" aria-hidden="true"><path fill="#101116" d="M2 24 4 2 17 17 47 17 60 2 62 24 62 43 57 51 7 51 2 43Z"/><path fill="#292c35" d="M9 23h46v22H9z"/><path fill="#292c35" d="M14 14h8v12h-8zm28 0h8v12h-8z"/><path fill="#fff" d="M14 28h9v7h-9zm27 0h9v7h-9z"/><path fill="#aeb3c0" d="M27 39h10v4H27z"/></svg>
                <span class="character-name">СУМРАК</span></button>
            </div>
            <p class="upgrade-note">ЭФФЕКТЫ И УЛУЧШЕНИЯ БУДУТ ОТКРЫВАТЬСЯ ЗА ПРОХОЖДЕНИЕ</p>
            <button class="back-button" id="back-menu" type="button">← НАЗАД</button>
          </section>
        </div>
      </div>
    </section>
    <nav class="controls" aria-label="Игровое управление">
      <button class="control-btn dash-control" id="dash-btn" type="button" aria-label="Дэш"><span>»</span><b>DASH</b></button>
      <button class="control-btn jump-control" id="jump-btn" type="button" aria-label="Прыжок"><span>↑</span><b>JUMP</b></button>
    </nav>
    <footer class="game-footer"><span>ПРЫГАЙ ЧЕРЕЗ ПРОПАСТИ</span><span>ДЭШ — РЫВОК ВПЕРЁД</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
